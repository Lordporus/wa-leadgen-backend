name: Backend CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
      AIRTABLE_API_KEY: ""
      AIRTABLE_BASE_ID: ""
      APIFY_API_TOKEN: ""
      DATABASE_URL: ""
      GEMINI_API_KEY: ""
      NINEROUTER_API_KEY: ""
      REDIS_URL: ""
      SENTRY_DSN: ""
      WHATSAPP_ACCESS_TOKEN: ""
      WHATSAPP_PHONE_NUMBER_ID: ""
      WHATSAPP_BUSINESS_ACCOUNT_ID: ""
      WHATSAPP_APP_SECRET: offline-ci-secret
      WHATSAPP_VERIFY_TOKEN: offline-ci-token
      MIGRATION_MODE: airtable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Reject local environment files
        run: |
          test ! -f .env
          test ! -f .env.local
          test ! -f .env.production
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Run offline unit tests
        run: python -m pytest tests/unit -q

  lint-type-import:
    runs-on: ubuntu-latest
    env:
      APP_ENV: ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run dependency-free lint, type-contract, and import checks
        run: python scripts/ci_static_checks.py

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scan tracked source without printing values
        run: python scripts/ci_secret_scan.py
