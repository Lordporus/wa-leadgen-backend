name: Approved migration release

on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub deployment environment with approval and DATABASE_URL secret
        required: true
        type: choice
        options: [staging, production]
      commit_sha:
        description: Full reviewed commit SHA from main containing this migration
        required: true
        type: string
      expected_current_revision:
        description: Exact Alembic revision expected before this release
        required: true
        type: string
      expected_target_revision:
        description: Exact reviewed Alembic head to apply in this release
        required: true
        type: string
      backup_verified:
        description: Verified backup/recovery evidence exists for this environment
        required: true
        type: boolean
      approval_id:
        description: Recorded migration approval identifier
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: approved-migration-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  migrate:
    environment: ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_ENV: ci
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Validate immutable release commit
        shell: bash
        env:
          TARGET_SHA: ${{ inputs.commit_sha }}
        run: |
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::A full lowercase commit SHA is required"; exit 1; }
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0
      - name: Require release commit and successful Backend CI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_SHA: ${{ inputs.commit_sha }}
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$TARGET_SHA" origin/main
          successful_runs="$(gh run list \
            --workflow ci.yml \
            --commit "$TARGET_SHA" \
            --event push \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq 'length')"
          [[ "$successful_runs" == "1" ]] || { echo "::error::Target SHA has no successful Backend CI push run"; exit 1; }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Apply one approved migration release
        env:
          EXPECTED_CURRENT_REVISION: ${{ inputs.expected_current_revision }}
          EXPECTED_TARGET_REVISION: ${{ inputs.expected_target_revision }}
          BACKUP_VERIFIED: ${{ inputs.backup_verified }}
          APPROVAL_ID: ${{ inputs.approval_id }}
        run: |
          test "$BACKUP_VERIFIED" = "true"
          python scripts/run_migrations.py \
            --expected-current-revision "$EXPECTED_CURRENT_REVISION" \
            --expected-target-revision "$EXPECTED_TARGET_REVISION" \
            --backup-verified \
            --approval-id "$APPROVAL_ID"
      - name: Record non-secret migration release manifest
        env:
          TARGET_SHA: ${{ inputs.commit_sha }}
          ENVIRONMENT: ${{ inputs.environment }}
          EXPECTED_CURRENT_REVISION: ${{ inputs.expected_current_revision }}
          EXPECTED_TARGET_REVISION: ${{ inputs.expected_target_revision }}
          APPROVAL_ID: ${{ inputs.approval_id }}
        run: |
          {
            echo "### Approved migration release"
            echo "- Commit: \`$TARGET_SHA\`"
            echo "- Environment: \`$ENVIRONMENT\`"
            echo "- Expected revision: \`$EXPECTED_CURRENT_REVISION\`"
            echo "- Validated target revision: \`$EXPECTED_TARGET_REVISION\`"
            echo "- Approval: \`$APPROVAL_ID\`"
          } >> "$GITHUB_STEP_SUMMARY"
