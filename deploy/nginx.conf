map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

upstream qualify_frontend {
    server frontend:3000;
}

upstream qualify_api {
    server api:8000;
}

# HTTP bootstrap only. nginx.https.conf is the inactive production TLS template.
# Do not activate its redirects or port 443 servers until its certificates exist.
server {
    listen 80;
    listen [::]:80;
    server_name getqualify.in www.getqualify.in;

    location / {
        proxy_pass http://qualify_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name api.getqualify.in;

    location / {
        proxy_pass http://qualify_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
