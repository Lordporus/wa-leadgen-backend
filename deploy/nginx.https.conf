# INACTIVE TEMPLATE: do not mount this file until every referenced certificate
# and private key exists on the VPS. The active HTTP bootstrap is nginx.conf.
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

upstream qualify_frontend {
    server frontend:3000;
}

upstream qualify_api {
    server api:8000;
}

server {
    listen 80;
    listen [::]:80;
    server_name getqualify.in www.getqualify.in;
    return 301 https://$host$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.getqualify.in;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name getqualify.in www.getqualify.in;

    ssl_certificate /etc/letsencrypt/live/getqualify.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/getqualify.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://qualify_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.getqualify.in;

    ssl_certificate /etc/letsencrypt/live/api.getqualify.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.getqualify.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://qualify_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
